<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 指定网页使用 UTF-8 编码，避免中文显示为乱码。 -->
  <meta charset="utf-8">

  <!-- 让网页在手机屏幕上正确缩放。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 显示在浏览器标签页中的网站标题。 -->
  <title>我的大学纪念网站</title>

  <style>
    /* 设置整个页面的字体、宽度、边距、文字颜色和背景颜色。 */
    body {
      max-width: 760px;
      margin: 56px auto;
      padding: 0 22px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.9;
      color: #202124;
      background: #f7fafc;
    }

    /* 设置主标题的颜色。 */
    h1 {
      color: #0f4c5c;
    }

    /* 设置二级标题的上方间距和颜色。 */
    h2 {
      margin-top: 36px;
      color: #1f2937;
    }

    /* 设置日期文字的颜色。 */
    .date {
      color: #64748b;
    }

    /* 设置网页底部版权区的样式。 */
    footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid #dbe3ea;
      color: #64748b;
      font-size: 14px;
    }

    /* 设置超链接颜色。 */
    a {
      color: #0969da;
    }

    /* 让图片不超出页面宽度。 */
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <!-- 网页的主标题。把“我的名字”替换成你的公开名称。 -->
  <h1>我的大学纪念网站</h1>

  <!-- 记录网站创建时间。 -->
  <p class="date">创建于 2026 年</p>

  <!-- 网站简介。 -->
  <p>
    你好，这里记录我的大学生活、学习经历和一些值得纪念的时刻。
  </p>

  <!-- 个人介绍区。 -->
  <h2>关于我</h2>

  <!-- 在这里填写你愿意公开展示的内容。 -->
  <p>
    我是一名大学新生。这个网站是我为大学生活建立的一份长期记录。
  </p>

  <!-- 记录区。 -->
  <h2>大学记录</h2>

  <!-- 你以后可以持续增加新的记录。 -->
  <p>
    2026 年：我开始了大学生活，也建立了这个属于自己的网站。
  </p>

  <!-- 联系方式区。 -->
  <h2>联系方式</h2>

  <!-- 将邮箱替换为你愿意公开的邮箱地址。 -->
  <p>
    邮箱：
    <a href="mailto:your-email@example.com">
      your-email@example.com
    </a>
  </p>

  <!-- 页脚版权信息。 -->
  <footer>
    Copyright &copy; 2026 我的名字
  </footer>
</body>
</html>
